spring:
  application:
    name: flex_employ

  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/flexemploy
    username: root
    password: 666666

  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.skilal.flex_employ.entity
  configuration:
    map-underscore-to-camel-case: true

# JWT 配置
jwt:
  secret: FlexEmploySecretKeyForJWT2026ShouldBeLongEnoughForHS256Algorithm
  expiration: 86400000

aliyun:
  oss:
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    bucketName: skil-bucket01
    region: cn-hangzhou